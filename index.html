<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoStore | Tecnología</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/main.js"></script>
</head>
<body>
    <header class="encabezado">
        <h1>TecnoStore</h1>
        <p>Computadoras y accesorios de tecnología</p>
    </header>

    <p id="mensaje" class="mensaje" role="status"></p>

    <main class="contenido">
        <section class="catalogo">
            <h2>Computadoras y accesorios</h2>
            <div class="controles">
                <label for="busqueda">Buscar producto
                    <input id="busqueda" type="search" placeholder="Escribe un nombre">
                </label>
            </div>
            <div id="productos" class="grilla"></div>
        </section>

        <aside class="carrito">
            <div class="encabezado-carrito">
                <h2>Tu carrito</h2>
            </div>
            <ul id="lista" class="lista-carrito"></ul>
            <p id="total" class="total"></p>
            <button id="vaciar" class="btn-quitar" type="button">Vaciar carrito</button>
        </aside>
    </main>
</body>
</html>
